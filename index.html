<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZOBSI • adapt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            padding: 10px;
            transition: background 0.3s ease;
        }

        /* ===== ТЕМА 1: КРОВАВАЯ (RED) ===== */
        body.theme-blood {
            background: #0a0000;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(180, 30, 30, 0.15) 0px, transparent 50px),
                radial-gradient(circle at 90% 50%, rgba(150, 20, 20, 0.12) 0px, transparent 80px),
                radial-gradient(circle at 30% 80%, rgba(200, 40, 40, 0.1) 0px, transparent 100px),
                repeating-linear-gradient(45deg, rgba(255, 0, 0, 0.02) 0px, rgba(255, 0, 0, 0.02) 2px, transparent 2px, transparent 6px);
        }

        body.theme-blood .card {
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(200, 50, 50, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 30px rgba(200, 0, 0, 0.2);
        }

        body.theme-blood .btn {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(200, 50, 50, 0.3);
            border-bottom: 3px solid rgba(150, 30, 30, 0.5);
            color: #eee;
        }

        body.theme-blood .btn:hover {
            background: #fff;
            color: #000;
            border-color: #a00;
            box-shadow: 0 2px 20px #f33;
        }

        body.theme-blood .theme-btn.active {
            border-bottom-color: #c41e1e;
            background: rgba(150, 30, 30, 0.3);
        }

        /* ===== ТЕМА 2: ТЕМНЫЙ ШУМ (GRAY) ===== */
        body.theme-noise {
            background: #000;
            background-image: 
                radial-gradient(circle at 30% 40%, #2a2a2a 0px, transparent 200px),
                radial-gradient(circle at 80% 70%, #1a1a1a 0px, transparent 250px),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.05"/></svg>');
        }

        body.theme-noise .card {
            background: rgba(5, 5, 5, 0.9);
            border: 1px solid rgba(100, 100, 100, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 20px rgba(255,255,255,0.05);
        }

        body.theme-noise .btn {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(150, 150, 150, 0.2);
            border-bottom: 3px solid rgba(100, 100, 100, 0.3);
            color: #ccc;
        }

        body.theme-noise .btn:hover {
            background: #fff;
            color: #000;
            border-color: #888;
            box-shadow: 0 2px 20px rgba(255,255,255,0.3);
        }

        body.theme-noise .theme-btn.active {
            border-bottom-color: #aaa;
            background: rgba(100, 100, 100, 0.3);
        }

        /* ===== ТЕМА 3: МИНИМАЛ (BLACK & WHITE) ===== */
        body.theme-minimal {
            background: #000;
            background-image: 
                linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 50%),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 30px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 30px);
        }

        body.theme-minimal .card {
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.05);
        }

        body.theme-minimal .btn {
            background: #111;
            border: 1px solid #333;
            border-bottom: 3px solid #333;
            color: #eee;
        }

        body.theme-minimal .btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
            box-shadow: 0 2px 30px rgba(255,255,255,0.3);
        }

        body.theme-minimal .theme-btn.active {
            border-bottom-color: #fff;
            background: rgba(255,255,255,0.1);
        }

        /* ===== ТЕМА 4: НЕОН (BLUE) ===== */
        body.theme-neon {
            background: #000810;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 100, 255, 0.1) 0px, transparent 150px),
                radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.1) 0px, transparent 200px),
                repeating-linear-gradient(0deg, rgba(0, 150, 255, 0.02) 0px, transparent 1px, transparent 20px);
        }

        body.theme-neon .card {
            background: rgba(5, 10, 20, 0.85);
            border: 1px solid rgba(0, 150, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 30px rgba(0, 100, 255, 0.3);
        }

        body.theme-neon .btn {
            background: rgba(0, 10, 20, 0.7);
            border: 1px solid rgba(0, 150, 255, 0.3);
            border-bottom: 3px solid rgba(0, 100, 200, 0.5);
            color: #aaf;
        }

        body.theme-neon .btn:hover {
            background: #fff;
            color: #000;
            border-color: #0af;
            box-shadow: 0 2px 20px #0af;
        }

        body.theme-neon .theme-btn.active {
            border-bottom-color: #0af;
            background: rgba(0, 100, 255, 0.3);
        }

        /* ===== ТЕМА 5: МИСТИКА (PURPLE) ===== */
        body.theme-purple {
            background: #0a0010;
            background-image: 
                radial-gradient(circle at 30% 40%, rgba(150, 0, 255, 0.1) 0px, transparent 200px),
                radial-gradient(circle at 70% 60%, rgba(200, 0, 255, 0.1) 0px, transparent 250px),
                repeating-linear-gradient(45deg, rgba(200, 0, 255, 0.02) 0px, rgba(200, 0, 255, 0.02) 2px, transparent 2px, transparent 10px);
        }

        body.theme-purple .card {
            background: rgba(15, 5, 25, 0.85);
            border: 1px solid rgba(200, 0, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 30px rgba(150, 0, 255, 0.3);
        }

        body.theme-purple .btn {
            background: rgba(20, 5, 30, 0.7);
            border: 1px solid rgba(200, 0, 255, 0.3);
            border-bottom: 3px solid rgba(150, 0, 200, 0.5);
            color: #d9f;
        }

        body.theme-purple .btn:hover {
            background: #fff;
            color: #000;
            border-color: #c0f;
            box-shadow: 0 2px 20px #c0f;
        }

        body.theme-purple .theme-btn.active {
            border-bottom-color: #c0f;
            background: rgba(150, 0, 200, 0.3);
        }

        /* ===== ОСНОВНЫЕ СТИЛИ ===== */
        .card {
            max-width: 100%;
            width: 440px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: 40px;
            padding: 30px 25px 40px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Табы выбора темы */
        .theme-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            position: relative;
            z-index: 20;
            flex-wrap: wrap;
        }

        .theme-btn {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            border-bottom: 2px solid transparent;
        }

        .theme-btn:hover {
            color: #fff;
            background: rgba(30, 30, 30, 0.7);
        }

        .theme-btn.active {
            color: #fff;
        }

        .avatar-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.9);
            background: #111;
            object-fit: cover;
            box-shadow: 0 0 30px currentColor;
            transition: box-shadow 0.3s;
        }

        .avatar.error {
            background: #222 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="%23555" stroke-width="1"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>') no-repeat center;
        }

        .name {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 8px;
            margin: 10px 0 5px;
            text-transform: uppercase;
            text-shadow: 0 0 20px currentColor;
            position: relative;
            z-index: 10;
        }

        .sub {
            text-align: center;
            color: #aaa;
            font-size: 0.8rem;
            margin-bottom: 30px;
            letter-spacing: 3px;
            border-bottom: 1px solid currentColor;
            padding-bottom: 20px;
            position: relative;
            z-index: 10;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            z-index: 10;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            border-radius: 50px;
            padding: 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.2rem;
            transition: 0.25s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 0 #030000;
        }

        .btn span, .btn i {
            position: relative;
            z-index: 2;
        }

        .drop {
            position: absolute;
            background: currentColor;
            width: 5px;
            height: 8px;
            border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
            filter: blur(0.3px);
            box-shadow: 0 0 10px currentColor;
            pointer-events: none;
            animation: drip 1.5s linear forwards;
            z-index: 5;
        }

        @keyframes drip {
            0% { transform: translateY(-20px); opacity: 0.9; }
            100% { transform: translateY(200px); opacity: 0; }
        }

        .footer {
            text-align: center;
            color: #555;
            font-size: 0.6rem;
            margin-top: 25px;
            position: relative;
            z-index: 10;
        }

        @media (max-width: 400px) {
            .card { padding: 20px 15px 30px; }
            .avatar { width: 110px; height: 110px; }
            .name { font-size: 2rem; }
            .theme-btn { padding: 5px 10px; font-size: 0.7rem; }
        }
    </style>
</head>
<body class="theme-blood">
    <div class="card">
        <!-- Табы переключения тем (5 штук) -->
        <div class="theme-tabs">
            <div class="theme-btn active" data-theme="blood">КРОВЬ</div>
            <div class="theme-btn" data-theme="noise">ШУМ</div>
            <div class="theme-btn" data-theme="minimal">Ч/Б</div>
            <div class="theme-btn" data-theme="neon">НЕОН</div>
            <div class="theme-btn" data-theme="purple">МИСТИКА</div>
        </div>

        <div class="avatar-container">
            <img src="avatar.jpg" alt="avatar" class="avatar" onerror="this.classList.add('error');">
        </div>

        <div class="name">ZOBSI</div>
        <div class="sub">всемогущий</div>

        <!-- Кнопки с правильными ссылками -->
        <div class="buttons">
            <a href="https://t.me/zobsi" target="_blank" class="btn">◀ СВЯЗЬ ▶</a>
            <a href="https://t.me/zobsiks" target="_blank" class="btn">◀ КАНАЛ ▶</a>
            <a href="https://t.me/MariupolStarsMinbot" target="_blank" class="btn">◀ БОТ ▶</a>
        </div>

        <div class="footer">
            <span>🩸 заказать сайт - @waxues🩸</span>
        </div>
    </div>

    <script>
        // Переключение тем
        const themeBtns = document.querySelectorAll('.theme-btn');
        const body = document.body;

        themeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                themeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const theme = btn.dataset.theme;
                body.className = '';
                body.classList.add(`theme-${theme}`);
            });
        });

        // Капли крови
        document.querySelectorAll('.btn').forEach(button => {
            const createDrop = () => {
                const drop = document.createElement('div');
                drop.className = 'drop';
                drop.style.left = Math.random() * 100 + '%';
                drop.style.animationDuration = (1 + Math.random() * 1.5) + 's';
                drop.style.animationDelay = Math.random() * 0.3 + 's';
                drop.style.width = (3 + Math.random() * 6) + 'px';
                drop.style.height = (6 + Math.random() * 8) + 'px';
                button.appendChild(drop);
                setTimeout(() => drop.remove(), 2000);
            };
            
            button.addEventListener('mouseenter', () => {
                for(let i = 0; i < 25; i++) {
                    setTimeout(createDrop, i * 30);
                }
            });

            button.addEventListener('touchstart', (e) => {
                e.preventDefault();
                for(let i = 0; i < 15; i++) {
                    setTimeout(createDrop, i * 30);
                }
            });
        });

        // Аватар
        const av = document.querySelector('.avatar');
        av.addEventListener('error', function() { this.classList.add('error'); });
    </script>
</body>
</html>
